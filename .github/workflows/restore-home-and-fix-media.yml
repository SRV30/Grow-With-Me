name: Restore Home And Fix Media

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App and patch video covers
        run: |
          set -e
          git checkout 36ba0d8359f0b98c15485653eb1ef451ad6e5356 -- client/src/App.jsx
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/App.jsx')
          text = path.read_text()

          text = text.replace(
              "import QuoteCalculator from './components/QuoteCalculator.jsx'",
              "import QuoteCalculator from './components/QuoteCalculator.jsx'\nimport CloudinaryVideo from './components/CloudinaryVideo.jsx'",
              1,
          )

          marker = "const processIcons = [Users, CalendarDays, PenTool, ImageIcon, Rocket, ArrowRight]\n"
          helper = marker + "\nconst isVideoMedia = (media) => {\n  const url = media?.secureUrl || media?.url || ''\n  return (\n    media?.resourceType === 'video' ||\n    /\\/video\\/upload\\//i.test(url) ||\n    /\\.(mp4|webm|mov)(\\?|$)/i.test(url)\n  )\n}\n"
          text = text.replace(marker, helper, 1)

          old_card = '''      {project.coverImage?.url ? (\n        <img\n          src={project.coverImage.url}\n          alt={project.coverImage.alt || project.title}\n          loading="lazy"\n        />\n      ) : ('''
          new_card = '''      {project.coverImage?.url ? (\n        isVideoMedia(project.coverImage) ? (\n          <CloudinaryVideo\n            src={project.coverImage.url}\n            poster={project.coverImage.poster || project.coverImage.thumbnail}\n            className="figma-project-media"\n            controls={false}\n            aria-label={project.coverImage.alt || project.title}\n          />\n        ) : (\n          <img\n            src={project.coverImage.url}\n            alt={project.coverImage.alt || project.title}\n            loading="lazy"\n            className="figma-project-media"\n          />\n        )\n      ) : ('''
          if old_card not in text:
              raise SystemExit('ProjectCard block not found')
          text = text.replace(old_card, new_card, 1)

          old_hero = '''              {project?.coverImage?.url ? (\n                <img\n                  src={project.coverImage.url}\n                  alt={project.coverImage.alt || project.title}\n                  loading={index < 2 ? 'eager' : 'lazy'}\n                />\n              ) : ('''
          new_hero = '''              {project?.coverImage?.url ? (\n                isVideoMedia(project.coverImage) ? (\n                  <CloudinaryVideo\n                    src={project.coverImage.url}\n                    poster={project.coverImage.poster || project.coverImage.thumbnail}\n                    className="hero-collage-media"\n                    controls={false}\n                    aria-label={project.coverImage.alt || project.title}\n                  />\n                ) : (\n                  <img\n                    src={project.coverImage.url}\n                    alt={project.coverImage.alt || project.title}\n                    loading={index < 2 ? 'eager' : 'lazy'}\n                    className="hero-collage-media"\n                  />\n                )\n              ) : ('''
          if old_hero not in text:
              raise SystemExit('Hero block not found')
          text = text.replace(old_hero, new_hero, 1)
          path.write_text(text)
          PY

      - name: Make homepage portfolio responsive and media fit correctly
        run: |
          cat >> client/src/styles/figma-overrides.css <<'EOF'

          /* Responsive homepage portfolio cards. */
          .row-work-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 1.25vw, 18px);
            align-items: stretch;
          }

          .row-work-grid .figma-project-card {
            position: relative;
            width: 100%;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 14px;
          }

          .row-work-grid .figma-project-media,
          .row-work-grid .figma-project-card > img,
          .row-work-grid .figma-project-card > video {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            object-fit: cover;
            object-position: center;
          }

          .row-work-grid .figma-project-card > video {
            pointer-events: none;
          }

          .row-work-grid .figma-project-card:hover .figma-project-media,
          .row-work-grid .figma-project-card:hover > img,
          .row-work-grid .figma-project-card:hover > video {
            transform: scale(1.04);
          }

          .row-work-grid .figma-project-overlay {
            z-index: 2;
          }

          .hero-collage-media {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
          }

          .hero-collage-card > video {
            pointer-events: none;
          }

          @media (max-width: 1100px) {
            .row-work-grid {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
          }

          @media (max-width: 760px) {
            .row-work-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 12px;
            }

            .row-work-grid .figma-project-card {
              border-radius: 12px;
            }
          }

          @media (max-width: 480px) {
            .row-work-grid {
              grid-template-columns: 1fr;
              gap: 14px;
            }

            .row-work-grid .figma-project-card {
              aspect-ratio: 4 / 5;
              max-height: none;
            }
          }
          EOF

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx client/src/styles/figma-overrides.css
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: responsive homepage project media"
          git push
